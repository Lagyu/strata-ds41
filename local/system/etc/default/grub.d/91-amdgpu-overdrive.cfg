# RX 7900 XTX undervolt (2026-10-18): unlock amdgpu overdrive (bit 0x4000 on top of the default 0xfff7bfff) so
# pp_od_clk_voltage exists; amdgpu-undervolt.service then sets the values from /etc/amdgpu-undervolt.conf at boot.
# Remove this file and run `sudo update-grub` to go back.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT amdgpu.ppfeaturemask=0xfff7ffff"
