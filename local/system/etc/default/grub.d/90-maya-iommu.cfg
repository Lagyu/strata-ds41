# Project Maya (2026-10-18): IOMMU passthrough for the GPUs' DMA. With translated DMA (Ubuntu's default, DMA-FQ)
# the x16 RX 7900 XTX read pinned RAM at ~19 GB/s against ~22-27 GB/s on Windows. Remove this file and run
# `sudo update-grub` to go back.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT iommu=pt"
