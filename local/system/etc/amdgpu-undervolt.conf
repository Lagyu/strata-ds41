# RX 7900 XTX core clock cap + undervolt, applied at boot by amdgpu-undervolt.service (/usr/local/sbin/amdgpu-undervolt).
# The numbers mean the same as in Windows (gputune/ADLX, Adrenalin): VOLT_MV is the "max voltage" (factory 1150 mV, range
# 700..1150), which RDNA3 applies as an offset over the whole V/F curve, so Linux gets "vo VOLT_MV-FACTORY_MV" (-110 mV).
# After editing: sudo systemctl restart amdgpu-undervolt      Factory settings until next boot: sudo amdgpu-undervolt reset
# Windows history: the logon task ran 2700/1040 on both cards; 2700/1020 and 3150/1050 hard-froze the PC there.
CARDS="1849:5304 1849:5302"   # PCI subsystem ids: 5304 = PCIE1 (x16, bus 03), 5302 = PCIE3 (chipset x4, bus 09)
GFXCLK_MAX_MHZ=2800
VOLT_MV=1040
FACTORY_MV=1150
