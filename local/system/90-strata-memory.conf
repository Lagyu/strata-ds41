# strata-ds41 (2026-10-31): the engine pins ~100 GB of a 125 GB box; the kernel swapped its anonymous memory (2 GB out,
# 76K major faults, kswapd 37 min CPU) and proactive compaction triggered KFD userptr evict/restore storms that stall the GPU
# queues during decode.  Prefer dropping page cache (the model file re-reads at NVMe speed) and do not compact proactively.
# Install: sudo cp local/system/90-strata-memory.conf /etc/sysctl.d/ && sudo sysctl --system
vm.swappiness = 1
vm.compaction_proactiveness = 0
